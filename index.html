<head>
<meta charset="utf-8">

<title>Direction by December</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --g-paper:#F6F5F1;--g-surface:#FFFFFF;--g-ink:#15201B;--g-soft:#3D4A44;
    --g-muted:#6E7C75;--g-hair:#D8D8D0;--g-cypress:#2F5D50;--g-err:#9A3324;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --g-paper:#0F1512;--g-surface:#171F1B;--g-ink:#E7ECE8;--g-soft:#BAC5BF;
      --g-muted:#8A9A92;--g-hair:#2A3631;--g-cypress:#74B39C;--g-err:#E08b7c;
    }
  }
  :root[data-theme="dark"]{
    --g-paper:#0F1512;--g-surface:#171F1B;--g-ink:#E7ECE8;--g-soft:#BAC5BF;
    --g-muted:#8A9A92;--g-hair:#2A3631;--g-cypress:#74B39C;--g-err:#E08b7c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--g-paper);color:var(--g-ink);
    font-family:"Source Serif 4",ui-serif,Georgia,serif;}
  #gate{
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
  }
  .gate-card{
    width:100%;max-width:400px;background:var(--g-surface);
    border:1px solid var(--g-hair);border-radius:4px;padding:32px 30px;
  }
  .gate-k{
    font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
    letter-spacing:.15em;text-transform:uppercase;color:var(--g-cypress);
    margin:0 0 14px;
  }
  .gate-card h1{
    font-family:"Instrument Sans",system-ui,sans-serif;font-weight:600;
    letter-spacing:-.02em;font-size:1.65rem;line-height:1.1;margin:0 0 10px;
  }
  .gate-card p.sub{
    font-size:.94rem;line-height:1.55;color:var(--g-soft);margin:0 0 22px;
  }
  label{
    display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--g-muted);margin:0 0 7px;
  }
  input[type=password]{
    width:100%;padding:11px 13px;font-size:1rem;
    font-family:"Instrument Sans",system-ui,sans-serif;
    color:var(--g-ink);background:var(--g-paper);
    border:1px solid var(--g-hair);border-radius:3px;
  }
  input[type=password]:focus{outline:2px solid var(--g-cypress);outline-offset:1px;border-color:var(--g-cypress)}
  button{
    width:100%;margin-top:14px;padding:11px 14px;font-size:.95rem;font-weight:600;
    font-family:"Instrument Sans",system-ui,sans-serif;
    color:var(--g-paper);background:var(--g-cypress);
    border:0;border-radius:3px;cursor:pointer;
  }
  button:hover{opacity:.9}
  button:focus-visible{outline:2px solid var(--g-ink);outline-offset:2px}
  button[disabled]{opacity:.55;cursor:default}
  .err{
    color:var(--g-err);font-size:.88rem;margin:12px 0 0;min-height:1.2em;
    font-family:"Instrument Sans",system-ui,sans-serif;
  }
  .gate-foot{
    margin:22px 0 0;padding-top:16px;border-top:1px solid var(--g-hair);
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:.8rem;line-height:1.5;color:var(--g-muted);
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="gate">
  <form class="gate-card" id="gate-form" autocomplete="off">
    <p class="gate-k">Private document</p>
    <h1>Direction by December</h1>
    <p class="sub">Career strategy working document for Chris Coyoli. Enter the passphrase to continue.</p>
    <label for="pw">Passphrase</label>
    <input type="password" id="pw" name="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="go">Unlock</button>
    <p class="err" id="err" role="alert"></p>
    <p class="gate-foot">The contents of this page are encrypted. The passphrase is never sent anywhere; decryption happens in your browser.</p>
  </form>
</div>

<div id="doc" hidden></div>

  var SALT="B1xUjUVWshqHHmWPM3O2vA==";
  var IV="cCRIErq5Ak21lD2b";
  var ITER=250000;

  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}

  var form=document.getElementById('gate-form');
  var pw=document.getElementById('pw');
  var err=document.getElementById('err');
  var go=document.getElementById('go');

  function reveal(html){
    var doc=document.getElementById('doc');
    doc.innerHTML=html;
    doc.hidden=false;
    document.getElementById('gate').remove();
    // <style> and <link> inserted via innerHTML apply, but move them to <head>
    // so they win the cascade over the gate's own rules.
    doc.querySelectorAll('style,link[rel="stylesheet"]').forEach(function(n){
      document.head.appendChild(n);
    });
    document.body.style.background='';
  }

  async function unlock(pass, quiet){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key=await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(PAYLOAD));
    var html=new TextDecoder().decode(plain);
    try{ sessionStorage.setItem('dd_pass', pass); }catch(e){}
    reveal(html);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent='';
    var pass=pw.value;
    if(!pass){ err.textContent='Enter the passphrase.'; return; }
    go.disabled=true; go.textContent='Unlocking\u2026';
    unlock(pass).catch(function(){
      go.disabled=false; go.textContent='Unlock';
      err.textContent='That passphrase does not match. Check for stray spaces or capitals.';
      pw.select();
    });
  });

  // Skip the prompt on a refresh within the same tab.
  try{
    var saved=sessionStorage.getItem('dd_pass');
    if(saved){ unlock(saved, true).catch(function(){ try{sessionStorage.removeItem('dd_pass');}catch(e){} }); }
  }catch(e){}
})();
